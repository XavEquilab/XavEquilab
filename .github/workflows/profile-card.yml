name: Profile card

on:
  schedule:
    - cron: "17 4 * * *"   # tous les jours à 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.py, ascii.txt, .github/workflows/profile-card.yml]

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Générer les SVG
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python3 profile.py
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg stats.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh profile card"
            git push
          fi
